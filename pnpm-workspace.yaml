packages:
  - "apps/*"
  # kernel, muse-mixer, content, distributor, connectors, x402, schema, ui (spine §6)
  # + classify (§8.3), media, artifacts (§11.1) = eleven packages.
  - "packages/*"
  - "tools/eslint-plugin-musebook"

# Keep transitive versions honest across one Next.js app and three Workers.
# typescript, vitest and wrangler are pinned HERE and nowhere else (§3.2 table is canonical).
# pg is a catalog entry for the same reason: apps/edge and apps/worker depend on it at
# runtime (both through Hyperdrive) and packages/muse-mixer declares it as a peerDependency
# — three consumers that must never disagree on the major.
#
# THERE IS DELIBERATELY NO `zod` ENTRY HERE. @x402/core needs ^3.24.2 and
# @modelcontextprotocol/server needs ^4.2.0; a catalog entry would force one on both.
# See "The zod split is load-bearing" above. Gate: `pnpm gate --check zod-split`.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  core-js-pure: false
  "@swc/core": false
  # thirdweb/supabase-js transitive natives — WASM fallbacks exist, but the
  # native paths are the fast ones and both are from established publishers.
  bufferutil: true
  utf-8-validate: true
  keccak: true
  # core-js@2.x ships a postinstall ad for its maintainer; the polyfill itself
  # installs fine without the script — deny it like @swc/core above.
  core-js: false
  '@contentauth/c2pa-node': set this to true or false
catalog:
  react: "19.3.0"
  react-dom: "19.3.0"
  typescript: "6.0.3"
  vitest: "4.1.11"
  "@vitest/coverage-v8": "4.1.11"
  "@vitest/coverage-istanbul": "4.1.11"
  wrangler: "4.137.0"
  "@cloudflare/vitest-plugin": "1.2.0"
  "@cloudflare/workers-types": "5.20260921.1"
  pg: "8.23.0"
  fast-check: "4.10.2"
  msw: "2.15.0"
  undici: "8.10.2"
  "@playwright/test": "1.63.0"
  # M3 identity stack (§5). thirdweb is EXACT 5.121.4 — ^5.115.3 spans a silent
  # x402 v1→v2 flip (CF-SPINE §4); no caret here on purpose.
  thirdweb: "5.121.4"
  jose: "6.2.12"
  "@supabase/supabase-js": "2.116.0"
  server-only: "0.0.1"
  "@types/pg": "8.23.1"

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.2.0"
  - miniflare@5.20260921.0-alpha
  - wrangler@4.136.0 || 4.136.1 || 4.136.3 || 4.137.0
  - "@cloudflare/unenv-preset@2.16.2"
  - '@contentauth/c2pa-node@0.9.8'
  - '@contentauth/c2pa-types@0.7.5'
  - '@contentauth/c2pa-utilities@0.3.1'
patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch

# Native postinstalls the media package needs (sharp/c2pa-node binaries).
onlyBuiltDependencies:
  - sharp
  - '@contentauth/c2pa-node'
  - fluent-ffmpeg
